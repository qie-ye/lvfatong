spring:
  main:
    allow-circular-references: true
  datasource:
    url: jdbc:mysql://localhost:3306/lvatong_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 3000ms

  jpa:
    hibernate:
      ddl-auto: update

  # 禁用Neo4j自动配置
  neo4j:
    uri: bolt://localhost:7687
    autoconfigure:
      exclude: org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration

logging:
  level:
    com.lvatong: DEBUG
    org.hibernate.SQL: DEBUG
