server:
  port: 8080

spring:
  application:
    name: lvatong
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:lvatong_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: lvatong
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:${ZIPKIN_PORT:9411}/api/v2/spans

zhipu:
  base-url: https://open.bigmodel.cn/api/paas/v4
  api-key: ${ZHIPU_API_KEY:}
  # ⚠️ 必须设置环境变量 ZHIPU_API_KEY，否则AI功能不可用
  # 获取地址: https://open.bigmodel.cn/usercenter/apikeys

jwt:
  secret: ${JWT_SECRET:lvatong-default-secret-key-change-in-production}
  expiration: 86400000
  refresh-expiration: 604800000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

contract:
  upload-dir: ${CONTRACT_UPLOAD_DIR:./uploads/contracts}

milvus:
  enabled: ${MILVUS_ENABLED:false}
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  db-name: ${MILVUS_DB:default}
  collection-name: ${MILVUS_COLLECTION:legal_vectors}
  embedding-dim: 1024
  index-type: HNSW
  metric-type: COSINE
  index-params: '{"M":16,"efConstruction":256}'
  search-params: '{"ef":128}'
  token: ${MILVUS_TOKEN:}

resilience4j:
  circuitbreaker:
    instances:
      zhipu:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

xfyun:
  app-id: ${XFYUN_APP_ID:}
  api-key: ${XFYUN_API_KEY:}
  api-secret: ${XFYUN_API_SECRET:}
  iat-url: wss://iat-api.xfyun.cn/v2/iat
  auth-ttl: 300

logging:
  level:
    com.lvatong.lft.ai: INFO
    com.lvatong.lft.rag: INFO
    com.lvatong.lft.service: INFO
    root: WARN
