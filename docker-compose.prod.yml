version: '3.8'

# ============================================================
# 律法通 - 生产部署配置
# 使用方法: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:
  # Spring Boot 后端
  lvatong-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lvatong-app
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: lvatong_prod
      MYSQL_USER: lvatong
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      JPA_DDL_AUTO: validate
      MILVUS_ENABLED: ${MILVUS_ENABLED:-false}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      CONTRACT_UPLOAD_DIR: /app/uploads/contracts
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ZIPKIN_HOST: zipkin
      ZIPKIN_PORT: 9411
    volumes:
      - contract_uploads:/app/uploads/contracts
      - app_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    networks:
      - lvatong-net

  # Nginx 反向代理 + 前端静态资源
  nginx:
    image: nginx:1.25-alpine
    container_name: lvatong-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - lvatong-app
    networks:
      - lvatong-net

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: lvatong-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lvatong_prod
      MYSQL_USER: lvatong
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./docker/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lvatong-net

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: lvatong-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lvatong-net

  # ---- Milvus Standalone 向量数据库 ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: lvatong-etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lvatong-net

  minio:
    image: minio/minio:RELEASE.2024-06-29T03-20-21Z
    container_name: lvatong-minio
    restart: always
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lvatong-net

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: lvatong-milvus
    restart: always
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    networks:
      - lvatong-net

  # 分布式链路追踪
  zipkin:
    image: openzipkin/zipkin:3
    container_name: lvatong-zipkin
    restart: always
    # 生产环境不暴露端口，仅供内部网络访问
    # ports:
    #   - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - lvatong-net

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: lvatong-prometheus
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - lvatong-net

  # Grafana 可视化
  grafana:
    image: grafana/grafana:10.4.0
    container_name: lvatong-grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lvatong-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - lvatong-net

volumes:
  mysql_data:
  redis_data:
  contract_uploads:
  app_logs:
  etcd_data:
  minio_data:
  milvus_data:
  prometheus_data:
  grafana_data:
  zipkin_data:

networks:
  lvatong-net:
    driver: bridge
