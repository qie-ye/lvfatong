version: '3.8'

# 本地开发无需Docker，直接安装MySQL+Redis即可
# Milvus使用嵌入式Milvus Lite（Java依赖），无需独立部署
# 此文件仅用于后续生产部署或团队协作

services:
  mysql:
    image: mysql:8.0
    container_name: lvatong-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lvatong_dev
      MYSQL_USER: lvatong
      MYSQL_PASSWORD: lvatong123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./docker/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lvatong-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 分布式链路追踪
  zipkin:
    image: openzipkin/zipkin:3
    container_name: lvatong-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped

  # ---- Milvus Standalone 向量数据库 ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: lvatong-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lvatong-net

  minio:
    image: minio/minio:RELEASE.2024-06-29T03-20-21Z
    container_name: lvatong-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lvatong-net

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: lvatong-milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    networks:
      - lvatong-net

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  lvatong-net:
    driver: bridge
